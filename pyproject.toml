[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recorandro"
version = "0.1.0"
description = "Local audio processing, verified ZIP exports, and a Termux browser interface"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
recorandro = "recorandro.cli:main"

[tool.setuptools.packages.find]
include = ["recorandro*"]

[tool.setuptools.package-data]
recorandro = ["mobile_web/*.html", "mobile_web/*.js", "mobile_web/*.css"]
