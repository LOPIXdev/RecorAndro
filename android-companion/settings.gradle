pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

if (gradle.gradleVersion != '8.9') {
    throw new GradleException('The A2 companion build requires Gradle 8.9.')
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'RecorAndroCompanion'
include ':app'
